[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-auto-ai"
version = "0.1.0"
description = "Binance USDT-M perpetual futures bot driven by LLM trade signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.4.0",
    "filelock>=3.13.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "gymnasium>=0.29.0"]
realtime = ["websocket-client>=1.7.0"]
# CoinGlass 衍生品数据选币维度（socks 代理另需 PySocks：requests[socks]）
coinglass = ["requests>=2.31.0"]
ml-torch = ["torch>=2.1.0"]
ml-tf = ["tensorflow>=2.15.0"]
rl = ["stable-baselines3>=2.3.0", "gymnasium>=0.29"]

[project.scripts]
binance-auto-ai = "binance_auto_ai.cli:main"
binance-auto-backtest = "binance_auto_ai.backtest_cli:main"
binance-auto-real-pnl = "binance_auto_ai.real_pnl_cli:main"
binance-auto-var-validate = "binance_auto_ai.var_validation_cli:main"
binance-auto-signal = "binance_auto_ai.signal_cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Pylance / Pyright: resolve `binance_auto_ai` from src layout (fixes unresolved import warnings in IDE)
[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["src"]
include = ["src", "tests"]