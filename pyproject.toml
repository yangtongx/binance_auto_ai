[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-llm-bot"
version = "0.1.0"
description = "Binance USDT-M perpetual futures bot driven by LLM trade signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.4.0",
    "filelock>=3.13.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
realtime = ["websocket-client>=1.7.0"]
ml-torch = ["torch>=2.1.0"]
ml-tf = ["tensorflow>=2.15.0"]

[project.scripts]
futures-llm-bot = "futures_llm_bot.cli:main"
futures-llm-backtest = "futures_llm_bot.backtest_cli:main"
futures-llm-real-pnl = "futures_llm_bot.real_pnl_cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Pylance / Pyright: resolve `futures_llm_bot` from src layout (fixes unresolved import warnings in IDE)
[tool.pyright]
pythonVersion = "3.10"
extraPaths = ["src"]
include = ["src", "tests"]