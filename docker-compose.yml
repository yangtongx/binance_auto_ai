services:
  bot:
    build: .
    container_name: futures-llm-bot
    restart: unless-stopped
    init: true  # propagate SIGTERM cleanly and reap zombies
    env_file: .env
    environment:
      # Override .env for container-side networking and persistence.
      OBSERVABILITY_HOST: 0.0.0.0
      OBSERVABILITY_PORT: "8080"
      STATE_FILE: /app/state/state.json
      # Inject secrets via files (see `secrets:` below). Removes the need to put keys in .env.
      BINANCE_API_KEY_FILE: /run/secrets/binance_api_key
      BINANCE_API_SECRET_FILE: /run/secrets/binance_api_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - binance_api_key
      - binance_api_secret
      - openai_api_key
    volumes:
      # `:Z` lets Docker re-label the host dir for SELinux-enforcing systems
      # (RHEL/CentOS/Rocky/AlmaLinux/OpenCloudOS). On Ubuntu/Debian it is a no-op.
      - ./state:/app/state:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # Dashboard / metrics: only exposed on host loopback. Reverse-proxy if needed.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Server listens on 0.0.0.0:8080 inside the container; localhost works for the in-container probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  binance_api_key:
    file: ./secrets/binance_api_key
  binance_api_secret:
    file: ./secrets/binance_api_secret
  openai_api_key:
    file: ./secrets/openai_api_key
