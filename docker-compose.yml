services:
  bot:
    build: .
    container_name: futures-llm-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # 从密钥文件注入敏感信息，覆盖 .env 中的空值
      BINANCE_API_KEY_FILE: /run/secrets/binance_api_key
      BINANCE_API_SECRET_FILE: /run/secrets/binance_api_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - binance_api_key
      - binance_api_secret
      - openai_api_key
    volumes:
      - ./state:/app/state
    ports:
      # observability dashboard; adjust to match OBSERVABILITY_PORT
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  binance_api_key:
    file: ./secrets/binance_api_key
  binance_api_secret:
    file: ./secrets/binance_api_secret
  openai_api_key:
    file: ./secrets/openai_api_key
